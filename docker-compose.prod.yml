name: printgoo-erp-prod

services:
  caddy:
    image: caddy:2-alpine
    container_name: printgoo-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      S3_PUBLIC_DOMAIN: ${S3_PUBLIC_DOMAIN:-s3.localhost}
      CADDY_AUTO_HTTPS: ${CADDY_AUTO_HTTPS:-off}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - minio

  app:
    build:
      context: .
      target: runner
    container_name: printgoo-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-printgoo}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-printgoo_erp}
      REDIS_URL: redis://redis:6379
      S3_INTERNAL_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: .
      target: worker
    container_name: printgoo-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-printgoo}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-printgoo_erp}
      REDIS_URL: redis://redis:6379
      S3_INTERNAL_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: printgoo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-printgoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-printgoo_erp}
      TZ: Asia/Tashkent
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-printgoo} -d ${POSTGRES_DB:-printgoo_erp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: printgoo-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "1gb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: elestio/minio:latest
    container_name: printgoo-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - miniodata_prod:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  pg-backup:
    image: prodrigestivill/postgres-backup-local:17-alpine
    container_name: printgoo-pg-backup
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-printgoo_erp}
      POSTGRES_USER: ${POSTGRES_USER:-printgoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 14
      BACKUP_KEEP_WEEKS: 8
      BACKUP_KEEP_MONTHS: 12
      TZ: Asia/Tashkent
    volumes:
      - pgbackups_prod:/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
  pgdata_prod:
  redisdata_prod:
  miniodata_prod:
  pgbackups_prod:
